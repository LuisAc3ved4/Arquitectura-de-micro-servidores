events {}

http {
    server {
        listen 80;

        # Redirige el tráfico a MS-1 (Usuarios)
        location /api1/ {
            proxy_pass http://ms-1:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Redirige el tráfico a MS-2 (Agenda)
        location /api2/ {
            proxy_pass http://ms-2:3001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}